<!DOCTYPE html>
<html lang="pl">
<head>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JŁ BUD</title>
    <meta name="description" content="Elewacje, ocieplenia i prace budowlane dla budynków jednorodzinnych i usługowych. JŁ BUD Sp. z o.o." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: "#0f172a",
                        accent: {
                            DEFAULT: "#f59e0b",
                            soft: "#fbbf24",
                            deep: "#d97706"
                        },
                        mist: "#f8fafc",
                        line: "#e2e8f0"
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        soft: "0 20px 50px -22px rgba(15,23,42,0.18)",
                        lift: "0 30px 70px -25px rgba(15,23,42,0.28)"
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="ikona.png" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="importmap">
        {
          "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
            "framer-motion": "https://esm.sh/framer-motion@11.5.4?external=react,react-dom",
            "lucide-react": "https://esm.sh/lucide-react@0.414.0?external=react,react-dom"
          }
        }
    </script>
</head>
<body class="bg-mist text-ink font-sans antialiased">
  <div id="root"></div>
  <script type="module">
      import React from "react";
      import ReactDOM from "react-dom/client";
      import * as JSXDev from "react/jsx-dev-runtime";

      // Udostępniamy funkcję tworzącą elementy, której używa wygenerowany plik App.jsx
      window.jsxDEV = JSXDev.jsxDEV;

      // Pobieramy kod z pliku App.jsx i montujemy go w elemencie <div id="root">
      import * as AppModule from "./App.js";
      const Component = AppModule.default || AppModule || Object.values(AppModule)[0];

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(Component));
  </script>
</body>
</html>
